      Value: |
        <p class="text-[18px] leading-[24px] text-[#1B1F27] font-normal mb-4" style="color: #1b1f27; background-color: #ffffff; margin-right: 0px; margin-bottom: 16px; margin-left: 0px; padding: 0px; border: 0px solid; line-height: 24px;">Al Ain Museum is ready to bring that story to life through carefully curated collections, archaeological discoveries, and cultural narratives that reflect the depth and significance of Al Ain and its wider landscape.</p>
        <p class="text-[18px] leading-[24px] text-[#1B1F27] font-normal mb-4" style="color: #1b1f27; background-color: #ffffff; margin: 0px 0px 16px; padding: 0px; border: 0px solid; line-height: 24px;">The museum is being renewed to meet international standards, while staying true to local heritage. It will be a place for learning, reflection, and connection.</p>
